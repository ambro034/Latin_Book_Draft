name: RAG tests

on:
  push:
    branches: [gh-pages]
    paths:
      - 'posts-generator/rag/**'
      - 'posts-generator/tests/**'
      - 'posts-generator/requirements-rag.txt'
      - '.github/workflows/rag-tests.yml'
      - '_posts/**'
  pull_request:
    paths:
      - 'posts-generator/rag/**'
      - 'posts-generator/tests/**'
      - 'posts-generator/requirements-rag.txt'
      - '.github/workflows/rag-tests.yml'
      - '_posts/**'
  workflow_dispatch:

concurrency:
  # serialize per branch so parallel runs don't blow past the 10-branch Neon cap
  group: rag-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: posts-generator/requirements-rag.txt

      - name: Install RAG deps
        working-directory: posts-generator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-rag.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-MiniLM-L6-v2-v1

      - name: Create ephemeral Neon test branch
        id: branch
        run: |
          set -euo pipefail
          name="ci-$(date +%s)-${GITHUB_RUN_ID}"
          # 4h TTL: leaks expire even if cleanup step never runs
          expires=$(python3 -c "import datetime; print((datetime.datetime.utcnow()+datetime.timedelta(hours=4)).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          resp=$(curl -fsS -X POST \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"branch\":{\"name\":\"${name}\",\"expires_at\":\"${expires}\"},\"endpoints\":[{\"type\":\"read_write\"}]}")
          branch_id=$(echo "$resp" | python3 -c "import json,sys; print(json.load(sys.stdin)['branch']['id'])")
          uri=$(curl -fsS \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?branch_id=${branch_id}&database_name=neondb&role_name=neondb_owner" \
            -H "Authorization: Bearer ${NEON_API_KEY}" | python3 -c "import json,sys; print(json.load(sys.stdin)['uri'])")
          echo "branch_id=${branch_id}" >> "$GITHUB_OUTPUT"
          echo "::add-mask::${uri}"
          echo "dsn=${uri}" >> "$GITHUB_OUTPUT"

      - name: Wait for branch compute to wake
        env:
          DSN: ${{ steps.branch.outputs.dsn }}
        run: |
          python3 -c "
          import os, time
          import psycopg
          dsn = os.environ['DSN']
          for _ in range(40):
              try:
                  with psycopg.connect(dsn, connect_timeout=5) as c:
                      with c.cursor() as cur:
                          cur.execute('create extension if not exists vector')
                  c.close() if False else None
                  print('ready')
                  break
              except Exception as e:
                  print('waiting:', e); time.sleep(1.5)
          else:
              raise SystemExit('branch never became reachable')
          "

      - name: Run tests
        working-directory: posts-generator
        env:
          BEOPS_TEST_DATABASE_URL: ${{ steps.branch.outputs.dsn }}
          PYTHONPATH: ${{ github.workspace }}/posts-generator
        run: |
          pytest tests/ -v --tb=short

      - name: Delete Neon test branch
        if: always() && steps.branch.outputs.branch_id != ''
        continue-on-error: true
        run: |
          curl -fsS -X DELETE \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${{ steps.branch.outputs.branch_id }}" \
            -H "Authorization: Bearer ${NEON_API_KEY}" || true
