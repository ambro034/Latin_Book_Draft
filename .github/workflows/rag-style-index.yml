name: RAG style index

# Index the author's Telegram channel posts (style corpus) into Neon, in a
# SEPARATE set of tables from the blog RAG. Used only to retrieve voice
# exemplars when drafting Telegram posts.

on:
  push:
    branches: [gh-pages]
    paths:
      - 'posts-generator/style_corpus/**'
      - 'posts-generator/rag/style.py'
      - 'posts-generator/rag/style_schema.sql'
      - 'posts-generator/requirements-rag.txt'
      - '.github/workflows/rag-style-index.yml'
  workflow_dispatch:

concurrency:
  group: rag-style-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: posts-generator/requirements-rag.txt

      - name: Install RAG deps
        working-directory: posts-generator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-rag.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-MiniLM-L6-v2-v1

      - name: Index style corpus
        working-directory: posts-generator
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          PYTHONPATH: ${{ github.workspace }}/posts-generator
        run: |
          python -m rag.style index
