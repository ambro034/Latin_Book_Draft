name: Sync posts to beops-main-site

on:
  push:
    branches: [gh-pages]
    paths:
      - '_posts/**'
      - '.github/scripts/build_posts_ts.py'
      - '.github/workflows/sync-to-beops-site.yml'
  workflow_dispatch:

concurrency:
  group: sync-to-beops-site
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Skip on weekends (UTC)
        id: gate
        run: |
          dow=$(date -u +%u)  # 1=Mon .. 7=Sun
          if [ "$dow" -ge 6 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "It's the weekend in UTC (dow=$dow). Skipping sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout BeOps (gh-pages)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: beops

      - name: Checkout beops-main-site (main)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: NeverTheSame/beops-main-site
          ref: main
          token: ${{ secrets.BEOPS_SITE_PUSH_TOKEN }}
          path: site

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate src/data/posts.ts
        if: steps.gate.outputs.skip != 'true'
        run: |
          python3 beops/.github/scripts/build_posts_ts.py \
            beops/_posts \
            site/src/data/posts.ts

      - name: Commit and push if changed
        if: steps.gate.outputs.skip != 'true'
        working-directory: site
        env:
          SRC_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet -- src/data/posts.ts; then
            echo "No changes to src/data/posts.ts. Nothing to do."
            exit 0
          fi

          git config user.name  "beops-sync-bot"
          git config user.email "beops-sync-bot@users.noreply.github.com"

          short_sha="${SRC_SHA:0:7}"
          {
            printf 'chore(writing): sync posts from BeOps@%s\n\n' "$short_sha"
            printf 'Auto-generated by NeverTheSame/BeOps sync-to-beops-site workflow.\n\n'
            printf 'Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>\n'
          } > /tmp/commit-msg.txt

          git add src/data/posts.ts
          git commit -F /tmp/commit-msg.txt
          git push origin main
